# Opção sem Docker: /etc/nginx/sites-available/cortei  (depois: certbot --nginx -d seudominio.com.br -d www.seudominio.com.br)
server {
    listen 80;
    server_name seudominio.com.br www.seudominio.com.br;
    client_max_body_size 10m;
    # Compacta o site antes de enviar: o index.html sai de ~450 KB para ~140 KB.
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/html text/css text/plain application/javascript application/json image/svg+xml;
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

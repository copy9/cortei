<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cortei: ganhe por cada visualização dos seus cortes</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=JetBrains+Mono:wght@400;700&display=swap">
<style>
/* Cortei UI v3: futurista e simples */
:root{--bg:#06060c;--bg2:#0a0a14;--card:rgba(255,255,255,.035);--s1:rgba(255,255,255,.035);--s2:rgba(255,255,255,.065);--line:rgba(255,255,255,.1);--bd:rgba(255,255,255,.09);--bd2:rgba(255,255,255,.17);--p:#7c5cff;--p2:#b9a8ff;--cy:#22d3ee;--tx:#f5f4fa;--mut:#a7a4bb;--ok:#34d399;--no:#fb7185;--h:262;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{background:#06060c;scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth;-webkit-text-size-adjust:100%}
*,*:before,*:after{box-sizing:inherit}
body{margin:0;color:var(--tx);font:400 16px/1.6 "Space Grotesk",system-ui,sans-serif;background-color:#06060c;background-image:radial-gradient(900px 520px at 8% -8%,rgba(124,92,255,.17),transparent 60%),radial-gradient(700px 420px at 100% 0,rgba(34,211,238,.07),transparent 60%);background-attachment:fixed;overflow-x:clip}
body:after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background-image:linear-gradient(rgba(255,255,255,.028) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.028) 1px,transparent 1px);background-size:56px 56px;-webkit-mask-image:radial-gradient(70% 60% at 50% 0,#000,transparent);mask-image:radial-gradient(70% 60% at 50% 0,#000,transparent)}
::selection{background:rgba(124,92,255,.5);color:#fff}
*{scrollbar-width:thin;scrollbar-color:#3a3a52 transparent}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:#3a3a52;border-radius:99px;border:2px solid transparent;background-clip:content-box}
a{color:inherit;text-decoration:none}img{max-width:100%}
h1,h2,h3{line-height:1.12;margin:0 0 .5em;font-weight:700;letter-spacing:-.03em}
h1{font-size:clamp(2rem,4.8vw,3.4rem)}h2{font-size:clamp(1.5rem,3.2vw,2.1rem)}h3{font-size:1.05rem;letter-spacing:-.01em}
p{margin:0 0 1em;color:var(--mut);max-width:64ch}small{color:var(--mut)}
.m,.prize,.calc b,.sg b,.kg b,.stats b,.cap{font-family:"JetBrains Mono",ui-monospace,monospace}
.w{max-width:none;margin:0 auto;padding:0 clamp(16px,3vw,44px)}.w.narrow{max-width:480px}.wd{max-width:none}
section.s{padding:36px 0 64px}.band{background:rgba(255,255,255,.02);border-block:1px solid var(--bd)}
.row{display:flex;flex-wrap:wrap;gap:12px}
.ok{color:var(--ok)}.no{color:var(--no)}.sc{overflow-x:auto}
@keyframes fin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
#app>*:not(.dr){animation:fin .35s ease both}
/* cabeçalho */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:rgba(6,6,12,.72);backdrop-filter:blur(16px) saturate(140%);border-bottom:1px solid var(--bd)}
header .w{display:flex;align-items:center;gap:28px;height:64px}
.logo{font-weight:700;font-size:1.3rem;letter-spacing:-.04em;color:#fff}.logo i{color:var(--cy);font-style:normal}
#nv{display:flex;flex:1;align-items:center;gap:20px;min-width:0}
.nl{display:flex;gap:4px;align-items:center}.nl a{padding:8px 12px;border-radius:10px;color:var(--mut);font-size:.92rem;white-space:nowrap;transition:background .15s,color .15s}.nl a:hover{color:#fff}.nl a.on{color:#fff;background:var(--s2)}
.nr{margin-left:auto;display:flex;gap:12px;align-items:center}.nr a{white-space:nowrap;color:var(--mut)}.nr a:hover{color:#fff}.nr .btn{color:#fff}
.pill{background:var(--s2);border:1px solid var(--bd2);color:#fff!important;padding:6px 14px;border-radius:999px;font-size:.85rem}.pill b{margin-left:8px;color:var(--cy);font-family:"JetBrains Mono",monospace;font-weight:600}
.navav{width:34px;height:34px;border-radius:50%;overflow:hidden;border:1px solid var(--bd2);display:grid;place-items:center;background:var(--s2);font:700 .9rem "JetBrains Mono",monospace;color:#fff!important}
#bg{display:none;margin-left:auto;background:var(--s1);border:1px solid var(--bd2);color:var(--tx);border-radius:10px;padding:7px 14px;font:inherit}
.bn{background:rgba(124,92,255,.16);border-bottom:1px solid var(--bd);padding:9px 20px;text-align:center;font-size:.9rem}
/* botões */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:linear-gradient(135deg,#8b6bff,#5b3dff);color:#fff;font:600 .95rem "Space Grotesk",sans-serif;padding:11px 20px;border-radius:12px;border:0;cursor:pointer;box-shadow:0 6px 20px rgba(91,61,255,.32);transition:transform .15s,filter .15s,box-shadow .15s}
.btn:hover{transform:translateY(-1px);filter:brightness(1.1);box-shadow:0 8px 26px rgba(91,61,255,.45)}
.btn.g{background:transparent;border:1px solid var(--bd2);box-shadow:none;color:var(--tx)}.btn.g:hover{background:var(--s2);border-color:rgba(255,255,255,.3);filter:none}
.btn.r{background:transparent;border:1px solid rgba(251,113,133,.5);color:var(--no);box-shadow:none}.btn.r:hover{background:rgba(251,113,133,.08);filter:none}
.btn.sm{padding:7px 14px;font-size:.85rem;border-radius:10px}.btn[disabled]{opacity:.5;cursor:not-allowed;transform:none;filter:none}
a:focus-visible,button:focus-visible,summary:focus-visible{outline:2px solid var(--cy);outline-offset:3px}
/* cartões */
.card,.calc{display:flex;flex-direction:column;gap:6px;padding:22px;border-radius:16px;background:var(--s1);border:1px solid var(--bd);position:relative;backdrop-filter:blur(12px);box-shadow:inset 0 1px 0 hsl(var(--h) 90% 75% / .1)}
.card.l:hover,a.card:hover{border-color:var(--bd2);background:var(--s2)}
.card h3{color:var(--tx);margin-bottom:.3em}
.calc b{display:block;font-size:2.8rem;line-height:1.1;background:linear-gradient(90deg,#b9a8ff,#22d3ee);-webkit-background-clip:text;background-clip:text;color:transparent}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(290px,100%),1fr));gap:20px}.grid.g3{grid-template-columns:repeat(auto-fill,minmax(min(320px,100%),1fr))}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.sg{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:16px;margin-bottom:22px}.kg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.sg .card,.kg .card{gap:2px;padding:18px}.sg b,.kg b{font-size:1.65rem;line-height:1.2;font-weight:600;color:#fff;letter-spacing:-.02em}.sg span,.kg span{color:var(--mut);font-size:.85rem}
.stats{display:flex;flex-wrap:wrap;gap:34px}.stats b{display:block;font-size:2rem;color:#fff}.stats span{color:var(--mut);font-size:.9rem}
.steps{counter-reset:s;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
.steps .card:before{counter-increment:s;content:counter(s);width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:var(--s2);border:1px solid var(--bd2);color:var(--p2);font:600 .85rem "JetBrains Mono",monospace;margin-bottom:8px}
.steps.nc .card:before,.nc .card:before{content:"";width:10px;height:10px;border-radius:50%;background:hsl(var(--h) 80% 62%);border:0;margin:4px 0 8px}
.tl,.nw{display:flex;gap:12px;padding:18px;border-radius:16px;border:1px solid var(--bd);background:var(--s1);transition:border-color .15s,background .15s,transform .15s}.tl{flex-direction:column;gap:3px}
.tl:hover{border-color:var(--bd2);background:var(--s2);transform:translateY(-2px)}.tl small,.nw p{color:var(--mut)}.tl b{color:#fff}.ti{font-size:1.5rem;line-height:1}
.nw{border-left:3px solid hsl(var(--h) 75% 62%)}
/* etiquetas */
.tag,.bg1{display:inline-flex;align-items:center;font-size:.74rem;padding:3px 10px;border-radius:999px;border:1px solid var(--bd);color:var(--mut);background:var(--s1);margin:0 6px 6px 0;white-space:nowrap}
.tag.p,.bg1{color:hsl(var(--h) 85% 80%);border-color:hsl(var(--h) 60% 60% / .4);background:hsl(var(--h) 60% 50% / .12)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;background:var(--ok)}.dot.y{background:#fbbf24}
.lbl{display:block;font-size:.76rem;letter-spacing:.07em;text-transform:uppercase;color:var(--mut);margin:10px 0 10px;font-family:"JetBrains Mono",monospace}.pcl .lbl:first-child{margin-top:0}
.sec{font-size:1.25rem;margin:36px 0 14px;display:flex;align-items:center;gap:10px}.sec:before{content:"";width:4px;height:1.1em;border-radius:2px;background:linear-gradient(180deg,var(--p),var(--cy))}
.lph{margin-bottom:24px}.lph h2{margin-bottom:8px}.lph p{margin:0}
/* formulários */
input,select,textarea{width:100%;background:rgba(255,255,255,.04);border:1px solid var(--bd2);color:var(--tx);border-radius:12px;padding:11px 14px;font:inherit;margin:4px 0 14px;transition:border-color .15s,box-shadow .15s}
textarea{min-height:92px}label{font-size:.88rem;color:var(--mut)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--p);box-shadow:0 0 0 3px rgba(124,92,255,.25)}
input[type=checkbox]{width:auto;margin:0 8px 0 0;accent-color:var(--p);vertical-align:middle}
input[type=range]{-webkit-appearance:none;appearance:none;height:5px;border-radius:99px;background:linear-gradient(90deg,var(--p),var(--cy));padding:0;border:0;margin:16px 0 8px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:#fff;border:4px solid var(--p);cursor:pointer}
input[type=range]::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:#fff;border:4px solid var(--p);cursor:pointer}
input[type=range]:focus{box-shadow:none}
.chips{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap}#ch{display:flex;flex-wrap:wrap;gap:0 28px}
.chips button,.fl button{background:var(--s1);border:1px solid var(--bd);color:var(--mut);border-radius:999px;padding:7px 15px;font:inherit;font-size:.88rem;cursor:pointer;transition:all .15s}
.chips button:hover,.fl button:hover{border-color:var(--bd2);color:#fff}.chips button.on,.fl button.on{background:#fff;border-color:#fff;color:#0a0a12;font-weight:600}
.chips button .ct,.fl button span{margin-left:7px;opacity:.65;font-size:.78rem}
/* tabelas, listas */
table{width:100%;border-collapse:collapse;font-size:.88rem}th,td{text-align:left;padding:11px 10px;border-bottom:1px solid var(--bd);vertical-align:middle}
th{font-size:.7rem;letter-spacing:.07em;text-transform:uppercase;font-weight:500;color:var(--mut);font-family:"JetBrains Mono",monospace}tr:hover td{background:rgba(255,255,255,.025)}
dl{display:grid;grid-template-columns:auto 1fr;gap:8px 22px;margin:0}dt{color:var(--mut)}dd{margin:0;font-size:.92rem}
dl.rg{grid-template-columns:1fr auto;gap:0}dl.rg dt,dl.rg dd{padding:11px 0;border-bottom:1px solid var(--bd);margin:0}dl.rg dd{font-weight:600;text-align:right}
details{border-bottom:1px solid var(--bd);padding:14px 0}summary{cursor:pointer;font-weight:600;list-style:none}summary:after{content:"+";float:right;color:var(--p2)}details[open] summary:after{content:"–"}details p{margin:10px 0 0}
ul.bl{margin:0;padding:0 0 0 18px;display:flex;flex-direction:column;gap:10px;color:#d8d6e6}.bl li::marker{color:var(--mut)}
.prize{font-size:1.5rem;font-weight:600;color:#fff;letter-spacing:-.02em}
.tabs{display:flex;border-bottom:1px solid var(--bd);overflow-x:auto}.tabs button{background:none;border:0;color:var(--mut);padding:14px 20px;font:inherit;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}.tabs button.on{color:#fff;border-bottom-color:var(--p)}
.fl{display:flex;gap:8px;flex-wrap:wrap;padding:14px 18px;border-bottom:1px solid var(--bd)}
.ai{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--bd)}.aic{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--s2);flex:none}
.empty{display:flex;flex-direction:column;align-items:center;gap:4px;padding:44px 10px;text-align:center}
.rw{display:flex;justify-content:space-between;padding:14px 20px;border-top:1px solid var(--bd)}.cap{letter-spacing:.08em;color:var(--mut);font-size:.7rem}
ol.hw{margin:0;padding-left:18px;color:var(--mut);display:flex;flex-direction:column;gap:8px}
.xp{height:8px;background:rgba(255,255,255,.08);border-radius:99px;margin:8px 0 6px;overflow:hidden}.xp i{display:block;height:100%;background:linear-gradient(90deg,var(--p),var(--cy));border-radius:99px;transition:width .6s}
.av{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font:700 1.7rem "JetBrains Mono",monospace;background:var(--s2);border:1px solid var(--bd2);flex:none;overflow:hidden;color:#fff}.av.sm{width:46px;height:46px;font-size:1.15rem}.av.big{width:84px;height:84px;font-size:2.2rem}.av img,.navav img{width:100%;height:100%;object-fit:cover;display:block}
.av2{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font:700 .75rem "JetBrains Mono",monospace;background:hsl(var(--h) 55% 38%);flex:none}
.bgd{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.bd{background:var(--s1);border:1px solid var(--bd);border-radius:14px;padding:14px;text-align:center;opacity:.4;filter:grayscale(1);display:flex;flex-direction:column;gap:4px;align-items:center}.bd.on{opacity:1;filter:none;border-color:hsl(var(--h) 65% 60% / .55);background:hsl(var(--h) 60% 50% / .08)}.bi{font-size:2rem;line-height:1}.bd small{font-size:.76rem}
.ts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:linear-gradient(135deg,#8b6bff,#5b3dff);color:#fff;padding:12px 20px;border-radius:12px;z-index:50;box-shadow:0 10px 36px rgba(91,61,255,.55);font-weight:600;max-width:90vw}
/* campanhas */
.cc{display:flex;flex-direction:column;gap:12px;padding:18px 18px 16px 21px;border-radius:16px;border:1px solid var(--bd);background:var(--s1);position:relative;overflow:hidden;transition:border-color .15s,background .15s,transform .15s}
.cc:before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:hsl(var(--h) 80% 62%)}
a.cc:hover{border-color:var(--bd2);background:var(--s2);transform:translateY(-2px)}
.ch{display:flex;gap:12px;align-items:center}
.lg{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;font:700 1.05rem "JetBrains Mono",monospace;background:linear-gradient(135deg,hsl(var(--h) 75% 58%),hsl(calc(var(--h) + 40) 70% 42%));color:#fff;flex:none;overflow:hidden}.c2 .lg{width:60px;height:60px}
.cn{font-weight:600;display:flex;align-items:center;gap:6px;margin:0;min-width:0}.cn .tx{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.vf{width:17px;height:17px;border-radius:50%;background:#3b82f6;color:#fff;font-size:.62rem;display:grid;place-items:center;flex:none}
.cnm{display:block;color:var(--mut);font-size:.8rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r1{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.pzr{text-align:right;flex:none}.pzr small{display:block;font-size:.62rem;letter-spacing:.07em;color:var(--mut)}.c2 .prize{font-size:1.4rem;line-height:1.1}
.bw{display:flex;gap:6px;flex-wrap:wrap}.ft{display:flex;justify-content:space-between;align-items:center;font-size:.8rem;color:var(--mut);margin-top:auto}.dl{background:var(--s2);padding:3px 10px;border-radius:999px;color:var(--tx)}
.lay{display:grid;grid-template-columns:1fr 340px;gap:26px;align-items:start}aside{display:flex;flex-direction:column;gap:14px;position:sticky;top:84px;align-self:start}aside p{margin:0}
.wn{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;font-size:.88rem;border:1px solid transparent}.wn>span:first-child{min-width:26px}
.wn.r1{background:rgba(255,196,0,.1);border-color:rgba(255,196,0,.35)}.wn.r2{background:rgba(205,210,230,.08);border-color:rgba(205,210,230,.25)}.wn.r3{background:rgba(205,127,50,.1);border-color:rgba(205,127,50,.35)}
/* início, banners */
.gr{display:flex;align-items:center;gap:18px;flex-wrap:wrap;margin-bottom:22px}
.hero2{display:flex;align-items:center;gap:20px;flex-wrap:wrap;padding:26px;border-radius:18px;border:1px solid var(--bd);background:radial-gradient(90% 140% at 0 0,hsl(var(--h) 80% 55% / .14),transparent 60%),var(--s1);margin-bottom:18px}
.bn2{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:8px;min-height:170px;padding:22px;border-radius:18px;border:1px solid var(--bd);background-size:cover;background-position:center;overflow:hidden;transition:transform .15s,border-color .15s}a.bn2:hover{transform:translateY(-2px);border-color:var(--bd2)}
.bn2 h3{margin:0;font-size:1.2rem;position:relative}.bn2 p{margin:0;color:#d8d6e6;max-width:46ch;position:relative}.bn2 .btn,.bn2 .bg1{position:relative}.bn2 .em{position:absolute;right:20px;bottom:6px;font-size:4rem;opacity:.3;pointer-events:none}
.bn2.big{min-height:280px;padding:34px}.bn2.big h3{font-size:2rem}.bn2.big .em{font-size:8rem}
.dots{display:flex;gap:8px;justify-content:center;margin:12px 0 0}.dots button{width:8px;height:8px;border-radius:50%;border:0;background:rgba(255,255,255,.2);cursor:pointer;padding:0;transition:width .2s}.dots button.on{background:#fff;width:22px;border-radius:5px}
.avs{display:flex;flex-direction:column;gap:8px;margin-bottom:16px}.avr{display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:12px;border:1px solid rgba(251,113,133,.3);background:rgba(251,113,133,.06);flex-wrap:wrap}.avr>div{flex:1;min-width:200px}
.pl2{display:grid;grid-template-columns:minmax(300px,340px) minmax(0,1fr);gap:28px;align-items:start;margin-top:18px}.pcl{display:flex;flex-direction:column;gap:16px;position:sticky;top:84px}
/* página inicial pública */
.hero{padding:72px 0 48px;background:radial-gradient(60% 70% at 85% 0,rgba(124,92,255,.2),transparent 70%)}
.hero .w{display:grid;grid-template-columns:1.1fr .9fr;gap:40px;align-items:center}.hero h1{font-size:clamp(2.2rem,5.4vw,4rem)}
.lead{font-size:1.15rem;max-width:56ch}.gt{display:block;background:linear-gradient(90deg,#b9a8ff,#22d3ee);-webkit-background-clip:text;background-clip:text;color:transparent}.chips2{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:22px;color:var(--mut);font-size:.9rem}
.ill{width:100%;height:auto;display:block;max-width:520px;margin:0 auto}.split{display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:center}
.cta{background:linear-gradient(135deg,rgba(124,92,255,.38),rgba(34,211,238,.16));border:1px solid var(--bd2);border-radius:22px;padding:44px 32px}.cta p{color:#dcd9ee}.cta .btn{background:#fff;color:#0a0a12;box-shadow:none}
footer{border-top:1px solid var(--bd);padding:34px 0;color:var(--mut);font-size:.9rem}footer .w{display:flex;flex-wrap:wrap;gap:20px 40px;justify-content:space-between}footer a:hover{color:#fff}
/* painel lateral da campanha */
.dr{position:fixed;inset:0;z-index:30;background:#06060c;display:grid;grid-template-columns:320px minmax(0,1fr);grid-template-rows:minmax(0,1fr);padding-top:env(safe-area-inset-top,0px)}
.dr .lf{border-right:1px solid var(--bd);padding:26px 22px;overflow:auto;min-height:0}.dr .rt{overflow:auto;padding:26px 30px 60px;display:flex;flex-direction:column;gap:14px;min-height:0}.dr .rt>*{flex:none}
.dr .x{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));right:18px;z-index:2;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--mut);border:1px solid var(--bd2);background:var(--s2)}.dr .x:hover{color:#fff}
.pbox{border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:16px;background:var(--s1)}
details.cd2{padding:0;flex:none;border:1px solid var(--bd);border-radius:14px;background:linear-gradient(180deg,hsl(var(--h) 60% 50% / .05),transparent),var(--s1);overflow:hidden}
.cd2>summary{list-style:none;cursor:pointer;margin:0;padding:15px 18px;color:#fff;font-size:1rem;font-weight:600;display:flex;align-items:center;gap:10px;user-select:none}
.cd2>summary:before{content:"";width:8px;height:8px;border-radius:50%;background:hsl(var(--h) 80% 62%);flex:none}

R.termos=()=>tx('Termos de participação',[['1. Conta','Cada pessoa mantém uma conta, com dados verdadeiros e atualizados, incluindo WhatsApp e dados de pagamento no caso de cortadores.'],['2. Conteúdo e regras','Os posts devem ser seus e seguir as regras de cada campanha. É proibido usar bots, comprar engajamento, repostar o mesmo conteúdo na mesma conta ou publicar conteúdo de terceiros como seu.'],['3. Revisão e validação das visualizações','Cada post passa por revisão manual da plataforma antes de valer. Só contam visualizações de posts dentro do período e das regras, e as que não parecem orgânicas são descontadas.'],['4. Pagamentos','O valor é calculado por mil visualizações validadas, conforme o valor definido em cada campanha. Quando o valor total da campanha acaba, novos posts não são monetizados. Depois da aprovação, o valor fica em carência de '+SET.car+' dias e só então é liberado para saque; se as visualizações forem removidas ou consideradas falsas nesse período, o valor é ajustado. Saques seguem o valor mínimo e as regras informadas no painel.'],['5. Marcas','A marca informa o valor e as regras. A plataforma define o modelo de pagamento, aprova cortadores, modera posts e descarta visualizações não orgânicas. Pedidos recusados são reembolsados.'],['6. Penalidades','A plataforma pode suspender contas e cancelar ganhos em caso de fraude ou descumprimento das regras.'],['7. Alterações','Estes termos podem mudar. Mudanças relevantes serão avisadas na plataforma.']]);
R.privacidade=()=>tx('Política de privacidade',[['Dados que coletamos','Nome, e-mail, WhatsApp, dados de pagamento (tipo e chave PIX, titular), contas de redes sociais, links e métricas dos posts enviados e, para marcas, valores e dados das campanhas.'],['Para que usamos','Operar a plataforma, validar visualizações, calcular e pagar ganhos, dar suporte e prevenir fraudes.'],['Quem vê o quê','Marcas veem os posts e as métricas das suas campanhas. Dados de contato e de pagamento dos cortadores ficam com a plataforma.'],['Armazenamento',SRV?'Seus dados ficam armazenados nos servidores da plataforma, com acesso restrito à equipe.':'Nesta versão de demonstração, os dados ficam salvos no navegador de quem usa.'],['Seus direitos','Você pode pedir acesso, correção ou exclusão dos seus dados pelo Perfil ou abrindo um ticket, conforme a LGPD.'],['Contato','Fale com a gente pela aba Tickets da sua conta.']]);

const ccD=c=>{const cp=c.t=='cpm',big=cp?c.pz.split(' por')[0]:c.pz;return`<div class="cc c2" data-act="cor" style="--h:${c.h};cursor:pointer"><div class="ch">${lg({b:c.b})}<div style="min-width:0;flex:1"><div class="r1"><div style="min-width:0"><div class="cn"><span class="tx">${c.b}</span><span class="vf">✓</span></div><small class="cnm">${c.n}</small></div><div class="pzr"><div class="prize">${big}</div><small>${cp?'POR MIL VISUALIZAÇÕES':'EM PRÊMIOS'}</small></div></div></div></div><div class="bw"><span class="bg1">🏆 ${cp?'Por visualização':'Ranking'}</span><span class="bg1">👥 ${c.i.toLocaleString('pt-BR')}</span><span class="bg1">🌎 Geral</span><span class="bg1" style="--h:38">Exemplo</span></div><div class="bw">${c.pl.map(x=>`<span class="tag">${x}</span>`).join('')}</div><div class="ft"><span class="dl">${c.d} restantes</span><span>5 exigências</span></div></div>`};
R.campanhas=()=>`<section class="s"><div class="w"><h1 style="font-size:2.6rem">Campanhas</h1><p>Escolha uma campanha, publique seus melhores cortes e receba por mil visualizações validadas.</p><div class="grid">${DEMO.map(ccD).join('')}</div><div class="cta" style="margin-top:36px"><h2>Quer ver Todas as campanhas?</h2><p>Entre ou crie sua conta de cortador.</p><div class="row"><button class="btn" data-act="cor">Criar conta de cortador</button><a class="btn" href="#/entrar">Entrar</a></div></div></div></section>`;

const KB=[],K=(r,q,a,k)=>KB.push({r,q,a,k:k.split('|')});
/* Visão geral e conta */
K('todos','O que é a Cortei?','A Cortei é uma plataforma que paga **cortadores** por mil visualizações validadas dos posts que publicam nas redes. **Marcas** investem um valor, definem as regras e acompanham os resultados. A plataforma conecta as duas pontas, valida as visualizações e paga os cortadores via PIX.','o que e a cortei|o que e cortei|cortei|plataforma|como funciona a cortei|como funciona a plataforma|serve|resumo');
K('todos','Qual a diferença entre cortador e marca?','**Cortador** é quem publica cortes nas próprias redes e recebe por mil visualizações validadas. **Marca** é quem contrata: investe um valor, define as regras e acompanha os resultados em um painel. A marca não aprova cortadores nem posts; isso é feito pela plataforma.','diferenca|cortador|marca|cliente|tipo de conta|qual conta|perfil');
K('todos','Como crio minha conta?','Escolha o seu tipo e cadastre-se: [Criar conta de cortador](cor) ou [Criar conta de marca](cli). Você informa nome, e-mail, senha e o **WhatsApp com DDD** (obrigatório). O cortador também informa a chave PIX.','criar conta|crio minha conta|criar minha conta|crio uma conta|abrir minha conta|cadastr|registr|inscrev|comecar|abrir conta|conta nova|whatsapp');
K('todos','Como entro na minha conta?','Na tela [Entrar](#/entrar), escolha **Sou cortador** ou **Sou cliente** (marca) e use seu e-mail e senha. Se escolher o tipo errado, o site avisa qual é o tipo da conta.','entrar|login|logar|acessar|acesso|senha|entrar na conta');
K('todos','Esqueci minha senha, o que faço?','Por enquanto não existe recuperação automática de senha. Se não lembrar, crie uma nova conta com outro e-mail ou fale com o suporte pelo [Ticket](#/tickets) caso ainda consiga entrar.','esqueci|recuperar|redefinir|perdi a senha|senha');
K('visitante','Preciso ter muitos seguidores?','Não. O que conta é o alcance real dos seus posts, medido em visualizações validadas. Não há mínimo de seguidores para participar.','seguidores|mínimo|minimo|audiencia|pequeno|poucos|iniciante');
K('todos','Quais redes sociais posso usar?','TikTok, Instagram, YouTube e Facebook. Cada campanha informa em quais redes o post é aceito. No perfil você cadastra quantas contas quiser de cada rede.','redes|rede social|tiktok|instagram|youtube|facebook|kwai|plataformas aceitas|onde postar|shorts|reels');
K('todos','A Cortei é gratuita?','Para o **cortador** é gratuita: você não paga nada para participar. A **marca** investe o valor da campanha e a plataforma retém uma taxa (percentual definido pela plataforma, hoje 15%). O restante vira prêmios ou visualizações para os cortadores.','gratis|gratuit|custa|custo|preco|taxa|cobra|pagar para|mensalidade|cobranca');
K('todos','Meus dados estão seguros?','Leia a [Política de privacidade](#/privacidade) e os [Termos de participação](#/termos). Dados de contato e pagamento dos cortadores ficam com a plataforma; as marcas veem só os posts e as métricas das suas campanhas.','seguro|seguranca|privacidade|lgpd|dados|protegid|vazar|navegador');
K('todos','Como falo com o suporte?','Se estiver logado, abra um ticket na aba **Tickets** ([cortador](#/tickets) ou [marca](#/cliente/tickets)). Você acompanha as respostas lá mesmo. Também há a [Central de ajuda](#/ajuda).','suporte|ajuda|ticket|atendimento|falar com|contato|reclam|problema|humano|equipe');
K('todos','Onde vejo os Termos e a Política de privacidade?','Estão no rodapé do site: [Termos de participação](#/termos) e [Política de privacidade](#/privacidade).','termos|politica|regulamento|contrato|lgpd');
K('todos','Como acesso a área administrativa?','O acesso administrativo é restrito à equipe da plataforma. Posso ajudar com dúvidas de cortadores e marcas.','admin|administrador|administrativo|painel admin|dono da plataforma');
/* Pagamento e cálculo */
K('todos','Como funciona o pagamento?','A Cortei paga por **mil visualizações validadas**. Cada post enviado passa por **revisão manual** da equipe; depois de aprovado, o valor fica em **carência de 15 dias** (valor definido pela plataforma) e então é liberado para saque via PIX. O cálculo é: visualizações validadas ÷ 1.000 × valor por mil da campanha.','pagamento|pagam|paga|pago|ganhar|ganho|dinheiro|grana|receber|renda|calcul|mil visualiza|cpm|quanto ganho|quanto rende');
K('todos','Quanto vou ganhar?','Depende do valor por mil de cada campanha, que varia de campanha para campanha. Só como exemplo ilustrativo: a R$ 1,50 por mil, 100 mil visualizações validadas rendem R$ 150,00. O valor real de cada campanha aparece na página dela.','quanto ganho|quanto eu ganho|ganho por mil|quanto vou ganhar|vou ganhar|quanto rende|quanto recebo|quanto paga|quanto pagam|quanto da|exemplo|calculadora|simular|ganhos');
K('todos','O valor por mil é igual em todas as campanhas?','Não. Cada campanha tem o seu valor por mil, definido pela plataforma. Veja o valor na página da campanha antes de participar.','valor por mil|mesmo valor|igual|varia|diferente|cada campanha');
K('todos','O que são visualizações validadas e o desconto?','São as visualizações que parecem orgânicas. As que não parecem (repetidas, automatizadas) são descontadas. No painel do cortador você vê visualizações monitoradas, validadas e o percentual de desconto aplicado.','validad|desconto|organic|monitorad|bot|falsa|nao organic|fraude|validacao');
K('todos','Quais são os modelos de campanha?','Existem dois: **pago por visualização (CPM)**, com um valor por mil visualizações validadas, e **campeonato**, com ranking e prêmios por posição. Quem define o modelo, o valor por mil e os prêmios é a plataforma.','modelo|cpm|campeonato|ranking|premio|tipo de campanha|pago por visualiza');
K('todos','Como funciona o campeonato?','No campeonato, os cortadores competem por **visualizações validadas**. A premiação por posição (1º, 2º, 3º...) e as datas de início, término e ranking final são definidas pela plataforma e aparecem na página da campanha, junto com o ranking.','campeonato|ranking|posicao|colocacao|primeiro lugar|pontuacao|competi');
K('todos','O que acontece quando o valor total da campanha acaba?','Nas campanhas por visualização, o valor total vai sendo descontado conforme os posts são aprovados, pelas visualizações validadas de cada um e começando pelos mais antigos. Quando acaba, novos posts deixam de ser monetizados. A página da campanha mostra o **Orçamento restante**.','acaba|esgot|orcamento|valor total|descont|restante|terminou|sem verba|encerrou');
K('todos','O que é campanha geral e regional?','**Geral** vale para qualquer lugar do Brasil. **Regional** é para cidades ou regiões específicas: o post deve marcar a localização e ter conteúdo voltado àquela audiência.','geral|regional|regiao|cidade|local|localizacao|brasil|onde');
K('cortador','O que é campanha surpresa?','É uma campanha que não aparece na lista e só abre por um anúncio na sua página [Início](#/home). Fique de olho nos banners de novidades e promoções.','surpresa|escondida|anuncio|banner|promocao|novidade');
/* Cortador */
K('cortador','Como me inscrevo em uma campanha?','Abra a campanha em [Campanhas](#/campanhas), leia as regras e clique em **Participar da campanha**. A inscrição fica em análise e, quando aceita, libera o material e o envio de posts.','participar|inscrev|entrar na campanha|aceita|aprovad|analise|aceite|escolher campanha');
K('cortador','Quanto tempo leva para minha inscrição ser aceita?','Depende da plataforma: a aprovação pode ser automática ou feita manualmente. Enquanto isso o botão aparece como "Inscrição em análise". Se demorar, abra um [ticket](#/tickets).','demora|quanto tempo|prazo aceite|em analise|pendente|inscricao');
K('cortador','Onde está o material da campanha?','O material (links do Drive, Mega ou Dropbox) é liberado na página da campanha depois que sua inscrição é aceita, no card **Conteúdo para usar**. Você pode abrir ou copiar o link.','material|conteudo para usar|drive|mega|dropbox|baixar|download|arquivos|video original|live');
K('cortador','Como envio meu post?','Com a inscrição aceita, vá ao card **Seu envio** na página da campanha ou em [Meus posts](#/posts), em **Enviar novo post**: escolha a conta cadastrada que vai postar, cole o **link do post**, confirme que cumpriu as regras e clique em **Enviar post**. Cada link só pode ser enviado uma vez.','enviar|envio|link do post|postar|publicar|mandar post|submeter|enviei|subir post');
K('cortador','Dá erro ao enviar o post, o que pode ser?','Os motivos mais comuns: sua inscrição ainda não foi aceita; o link não é de uma rede aceita pela campanha; você não escolheu uma conta dessa rede cadastrada no [perfil](#/perfil); ou o link já foi enviado antes.','erro|nao envia|nao consigo enviar|link invalido|nao aceita|falha|bug|conta de');
K('cortador','Como cadastro minhas contas de redes sociais?','No [Perfil](#/perfil), em **Contas de redes sociais**, escolha a rede, cole o link ou @ da conta e clique em Adicionar conta. Pode cadastrar várias por rede e remover quando quiser.','cadastrar conta|contas|adicionar conta|minhas redes|varias contas|mais de uma conta|link do perfil');
K('cortador','Como configuro meu pagamento (PIX)?','No [Perfil](#/perfil), em **Dados de pagamento**: escolha o tipo da chave PIX (CPF, e-mail, celular ou aleatória), informe a chave e o nome do titular. Sem isso o saque não é liberado.','pix|chave|titular|dados de pagamento|configurar pagamento|cpf|conta bancaria|banco');
K('cortador','Como e quando posso sacar?','No [Ganhos](#/painel), em **Sacar via PIX**, informe o valor (acima do mínimo definido pela plataforma, hoje R$ 10,00). Só o saldo **já liberado** (fora da carência) pode ser sacado. O pedido fica pendente até a plataforma pagar; depois aparece como pago em **Recibos**. Se for recusado, o valor volta ao seu saldo.','sacar|saco|saque|retirar|transferir|resgatar|minimo|quando recebo|receber o dinheiro|recibo');
K('todos','O que é a carência e quanto dura?','É um prazo de segurança, hoje de **15 dias**, entre a aprovação do post e a liberação do dinheiro. Nele a plataforma confirma que as visualizações continuam reais, porque as redes podem remover visualizações falsas depois. Se o número cair, o valor é ajustado. No painel você vê quantos dias faltam para cada post.','o que e a carencia|carencia|prazo de seguranca|15 dias|quinze dias|quando libera|liberar|libera|seguranca do pagamento|por que espera');
K('cortador','Quanto tempo demora o pagamento do saque?','O painel não mostra um prazo fixo. Acompanhe o status do seu saque na aba **Recibos** do [Ganhos](#/painel): pendente, pago ou recusado. Em caso de dúvida, abra um [ticket](#/tickets).','prazo|demora|saque pendente|quando cai|nao caiu|pagamento atrasado|atrasou');
K('cortador','Por que meu saldo está zerado?','Seus posts podem estar **em revisão** (a equipe ainda não aprovou) ou **em carência** (aprovados, aguardando 15 dias para liberar). O saldo disponível só mostra o que já foi liberado. Veja o detalhe no [Ganhos](#/painel), em Atividade.','saldo zerado|zero|nao aparece|nao recebi|sem saldo|por que nao|cade meu dinheiro');
K('cortador','O que significa cada status do meu post?','**Em revisão**: a equipe vai conferir o post. **Em carência**: aprovado, aguardando os 15 dias para liberar o valor. **Liberado**: o valor entrou no saldo disponível. **Rejeitado**: o post não foi aceito e o motivo aparece no painel.','status|em revisao|em carencia|liberado|rejeitado|aprovado|situacao do post');
K('cortador','Por que meu post pode ser rejeitado?','Falta da hashtag obrigatória, conteúdo fora das regras da campanha, repostagem do mesmo conteúdo, conteúdo de outras pessoas, perfil privado ou link que não é do post original.','rejeit|reprovad|negad|recusad|por que meu post|nao contou|nao conta');
K('cortador','Onde copio a legenda e a hashtag?','Na página da campanha, no card **O que incluir**: há a hashtag obrigatória e a **legenda pronta** com botão de copiar. Nas **Ações necessárias** estão as contas para seguir, marcar e o comentário pedido.','legenda|hashtag|copiar|marcar|seguir|comentar|comentario|o que incluir|acoes necessarias|exigencia|regras da campanha');
K('cortador','Posso postar em mais de uma conta?','Sim. Cadastre as contas no [Perfil](#/perfil) e escolha, a cada envio, qual conta publicou o post. Respeite as redes aceitas pela campanha.','mais de uma|varias contas|duas contas|contas diferentes|postar em varias');
K('cortador','O que é proibido na plataforma?','Usar bots ou comprar engajamento, publicar conteúdo de outras pessoas como seu, repetir o mesmo vídeo na mesma conta sem mudanças, colocar links de venda ou marcas não autorizadas e publicar conteúdo fora de contexto. Pode haver suspensão e cancelamento de ganhos.','proibido|proibicao|banir|banimento|punicao|suspens|regras|repost|roubo|copiar conteudo|marca d agua');
K('cortador','Como funcionam o nível e as medalhas?','Você ganha **100 XP por medalha** e **1 XP a cada 100 visualizações validadas**; cada nível pede 250 XP (Novato, Clipador, Cortador Pro, Viral e Lenda). São 15 medalhas, como Boas-vindas, Perfil completo, Multirrede, Primeiro corte, 1 mil, 10 mil e 100 mil visualizações e Primeiro saque. Veja no [Perfil](#/perfil).','medalha|nivel|xp|conquista|gamifica|titulo|novato|lenda|viral');
K('cortador','Como desbloqueio medalhas?','Ex.: **Perfil completo** (nome, PIX e uma conta), **Multirrede** (3 redes), **Na missão** (1 campanha), **Explorador** (3 campanhas), **Primeiro corte**, **Em ritmo** (5 cortes), **Dupla jornada** (2 redes), **1 mil / 10 mil / 100 mil visualizações**, **Primeiro saque** e **Primeiros R$ 10**.','desbloquear|como ganhar medalha|lista de medalhas|multirrede|explorador|em ritmo|dupla jornada');
K('cortador','O que tem na minha página Início?','Novidades, promoções e avisos da plataforma. Os anúncios são clicáveis e podem levar a campanhas, inclusive campanhas surpresa. As campanhas ficam na aba [Campanhas](#/campanhas) e o dinheiro no [Ganhos](#/painel).','inicio|home|pagina inicial|novidades|avisos|anuncios|promocoes');
K('cortador','Onde vejo meus ganhos e gráficos?','No [Ganhos](#/painel): saldo disponível, atividade (Ganhos e Recibos), desempenho (visualizações monitoradas, validadas, desconto, curtidas, comentários e compartilhamentos), gráficos e a tabela de posts monitorados.','painel|grafico|ganhos|desempenho|metricas|curtidas|comentarios|compartilhamentos|estatisticas');
K('cortador','Como altero foto, WhatsApp ou nome?','No [Perfil](#/perfil): envie a foto em **Foto de perfil** e edite nome, WhatsApp e dados de pagamento em **Dados de pagamento**, depois salve.','foto|avatar|trocar nome|alterar|editar perfil|whatsapp|mudar dados|atualizar');
K('cortador','Como excluo minha conta?','No [Perfil](#/perfil), use **Excluir conta** e clique de novo para confirmar. A ação não pode ser desfeita.','excluir conta|apagar conta|deletar|cancelar conta|sair da plataforma');
/* Marca */
K('marca','Como crio uma campanha?','Em [Campanhas](#/cliente/campanhas), clique em **Nova campanha** e informe: valor a investir, nome, prazo desejado, alcance (geral ou regional), plataformas, regras (contas para seguir e marcar, legenda, comentário, hashtag), briefing, redes da marca, material e, se quiser, uma imagem. A campanha nasce **Em análise**.','criar campanha|nova campanha|lancar campanha|abrir campanha|cadastrar campanha|montar campanha|como contrato');
K('marca','Quanto posso investir?','Qualquer valor a partir de R$ 1,00. Se o saldo da carteira não cobrir, o restante é cobrado via PIX (simulação). Você pode **adicionar mais valor** depois.','investir|valor minimo|quanto investir|minimo|orcamento|deposito|carteira|saldo');
K('marca','Como funciona a taxa da plataforma?','A plataforma retém um percentual do valor investido (hoje 15%). O restante fica disponível para prêmios ou visualizações dos cortadores e aparece como **Para prêmios/visualizações** na sua tabela de campanhas.','taxa|percentual|15|comissao|desconto do valor|quanto fica|retem');
K('marca','O que a plataforma define e o que eu defino?','Você não escolhe o modelo nem os prêmios. **Você** define o valor, as regras, a hashtag, o briefing, o material e as redes da marca. **A plataforma** define o modelo (CPM ou campeonato), o valor por mil, os prêmios, as vagas e as datas, aprova cortadores, modera os posts e paga os cortadores.','plataforma define|eu defino|quem define|escolher modelo|escolher o modelo|posso escolher|definir modelo|definir premio|definir valor por mil|cpm ou campeonato|escolher cpm|escolher campeonato|premio da campanha');
K('marca','Por que minha campanha está “Em análise”?','Porque a plataforma ainda vai configurar o modelo de pagamento, o valor por mil ou os prêmios e as datas. Quando ativar, ela aparece como **Ativa** para os cortadores. Se for recusada, o valor volta para a sua carteira.','em analise|pedido|nao ativou|quando ativa|aguardando|status da campanha|recusada|reembolso');
